name: consumer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out consumer
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify reviewed artifacts
        run: pnpm artifacts:verify
      - name: Runtime smoke
        run: pnpm runtime:smoke
      - name: Typecheck
        run: pnpm typecheck
      - name: Build public production assets
        run: pnpm build
      - name: Install Chromium
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Public Chromium smoke
        run: pnpm smoke:public
        env:
          CHROMIUM: chrome
      - name: Build instrumented test assets
        run: pnpm build:test
      - name: Run instrumented consumer browser verification
        run: pnpm test
        env:
          CHROMIUM: chrome
      - name: Run design audit regression tests
        run: node .agents/skills/frontend-design-guardian/scripts/test-audit-design.mjs
      - name: Audit mounted Ruseact page
        run: node .agents/skills/frontend-design-guardian/scripts/test-audit-app.mjs
        env:
          CHROMIUM: chrome
